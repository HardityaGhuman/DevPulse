name: CD

# Fires only after the CI workflow finishes on main — and the job guard below
# skips deploy unless CI concluded 'success'. So a red build never ships.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [ "main" ]
    types: [ completed ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
    - uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: auth
      # Configure GCP auth for GitHub Actions. Recommended: Workload Identity Federation
      # (no long-lived key). The GCP_CREDENTIALS secret below is a Service Account JSON key
      # (simpler, less secure) — swap for WIF when you can:
      #   with:
      #     workload_identity_provider: 'projects/123/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
      #     service_account: 'my-sa@my-project.iam.gserviceaccount.com'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'

    - name: Deploy to Cloud Run
      run: |
        cd backend
        gcloud run deploy devpulse-api \
          --source . \
          --region asia-south1 \
          --allow-unauthenticated \
          --max-instances 2
        # Note: replace `asia-south1` with your actual region if different.
